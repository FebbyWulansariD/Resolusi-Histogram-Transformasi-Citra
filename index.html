<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Febby W Damanik - Resolusi, Histogram dan Transformasi Citra</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b091a 0%, #1a103c 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(217, 70, 239, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #c084fc;
            --accent-glow: #22d3ee;
            --btn-bg: linear-gradient(135deg, #d946ef 0%, #8b5cf6 100%);
            --btn-hover: linear-gradient(135deg, #f472b6 0%, #a855f7 100%);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(23, 15, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(168, 85, 247, 0.15);
        }

        h3 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-top: 0;
            margin-bottom: 24px;
            background: linear-gradient(to right, #22d3ee, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .main-canvas-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(11, 9, 26, 0.7);
            border-radius: 16px;
            padding: 20px;
            border: 1px dashed rgba(217, 70, 239, 0.3);
            margin-bottom: 24px;
            min-height: 200px;
        }

        canvas {
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            height: auto;
            transition: transform 0.3s ease;
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        /* File Input Styling */
        input[type="file"] {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input[type="file"]::file-selector-button {
            background: rgba(217, 70, 239, 0.15);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-right: 12px;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(217, 70, 239, 0.3);
        }

        #resolution {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-glow);
            background: rgba(34, 211, 238, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(34, 211, 238, 0.3);
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 24px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        button:hover {
            color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.2);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .channel-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .channel-block {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .channel-block:hover {
            transform: translateY(-4px);
            border-color: rgba(217, 70, 239, 0.5);
        }

        .channel-block canvas {
            border: none;
            box-shadow: none;
            background: #ffffff;
            border-radius: 8px;
        }

        .channel-block p {
            margin: 12px 0 0 0;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.025em;
        }
    </style>
</head>

<body>

    <div class="container">
        <h3>Resolusi, Histogram dan Transformasi Citra</h3>

        <div class="main-canvas-wrapper">
            <canvas id="gambar" width="300" height="300"></canvas>
        </div>

        <div class="controls-panel">
            <input type="file" id="file1" accept=".jpg,.jpeg,.png,.bmp">

            <div id="resolution">Silakan upload gambar</div>

            <div class="button-group">
                <button onclick="showHistogram('gambar')">Show Histogram</button>
                <button onclick="transformGrayscale('gambar')">Transform to Grayscale</button>
                <button onclick="transformBinary('gambar')">Transform to Binary</button>
                <button onclick="transformNegative('gambar')">Transform to Negative</button>
            </div>
        </div>

        <div id="channels" class="channel-container"></div>
    </div>

    <script>
        let originalImage = null;

        function loadImage(fileInput, canvasId) {
            const file = fileInput.files[0];
            if (!file) return;

            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");
            const img = new Image();

            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;

                ctx.drawImage(img, 0, 0);
                originalImage = img;

                document.getElementById("resolution").textContent =
                    `Resolution: ${img.width} x ${img.height}`;

                URL.revokeObjectURL(img.src);
            };

            img.src = URL.createObjectURL(file);
        }

        function clearChannels() {
            document.getElementById("channels").innerHTML = "";
        }

        function appendToChannels(elementCanvas, label) {
            const container = document.getElementById("channels");
            const block = document.createElement("div");
            block.className = "channel-block";

            const caption = document.createElement("p");
            caption.textContent = label;

            block.appendChild(elementCanvas);
            block.appendChild(caption);
            container.appendChild(block);
        }

        function showHistogram(canvasId) {
            clearChannels();

            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const R = new Array(256).fill(0);
            const G = new Array(256).fill(0);
            const B = new Array(256).fill(0);

            for (let i = 0; i < imgData.data.length; i += 4) {
                R[imgData.data[i]]++;
                G[imgData.data[i + 1]]++;
                B[imgData.data[i + 2]]++;
            }

            const drawHistogramCanvas = (hist, color) => {
                const hCanvas = document.createElement("canvas");
                hCanvas.width = 256;
                hCanvas.height = 100;
                const hCtx = hCanvas.getContext("2d");

                hCtx.fillStyle = color;
                const maxLog = Math.log(Math.max(...hist) + 1) || 1;

                for (let i = 0; i < 256; i++) {
                    if (hist[i] > 0) {
                        const h = (Math.log(hist[i] + 1) / maxLog) * hCanvas.height;
                        hCtx.fillRect(i, hCanvas.height - h, 1, h);
                    }
                }
                return hCanvas;
            };

            appendToChannels(drawHistogramCanvas(R, "#ef4444"), "Red Channel");
            appendToChannels(drawHistogramCanvas(G, "#22c55e"), "Green Channel");
            appendToChannels(drawHistogramCanvas(B, "#3b82f6"), "Blue Channel");

            const combCanvas = document.createElement("canvas");
            combCanvas.width = 256;
            combCanvas.height = 100;
            const combCtx = combCanvas.getContext("2d");

            const maxLogAll = Math.log(Math.max(...R, ...G, ...B) + 1) || 1;

            const drawLine = (hist, color) => {
                combCtx.strokeStyle = color;
                combCtx.lineWidth = 1.5;
                combCtx.beginPath();
                for (let i = 0; i < 256; i++) {
                    const h = (Math.log(hist[i] + 1) / maxLogAll) * combCanvas.height;
                    const y = combCanvas.height - h;
                    if (i === 0) combCtx.moveTo(i, y);
                    else combCtx.lineTo(i, y);
                }
                combCtx.stroke();
            };

            drawLine(R, "#ef4444");
            drawLine(G, "#22c55e");
            drawLine(B, "#3b82f6");

            appendToChannels(combCanvas, "RGB Combined Histogram");
        }

        function transformGrayscale(canvasId) {
            clearChannels();

            const originalCanvas = document.getElementById(canvasId);
            const ctx = originalCanvas.getContext("2d");

            const imgData = ctx.getImageData(0, 0, originalCanvas.width, originalCanvas.height);

            const outCanvas = document.createElement("canvas");
            outCanvas.width = originalCanvas.width;
            outCanvas.height = originalCanvas.height;
            const outCtx = outCanvas.getContext("2d");

            const newImgData = outCtx.createImageData(originalCanvas.width, originalCanvas.height);

            for (let i = 0; i < imgData.data.length; i += 4) {
                const gray = Math.round(
                    0.299 * imgData.data[i] +
                    0.587 * imgData.data[i + 1] +
                    0.114 * imgData.data[i + 2]
                );

                newImgData.data[i] = gray;
                newImgData.data[i + 1] = gray;
                newImgData.data[i + 2] = gray;
                newImgData.data[i + 3] = imgData.data[i + 3];
            }

            outCtx.putImageData(newImgData, 0, 0);
            appendToChannels(outCanvas, "Grayscale");
        }

        function transformBinary(canvasId, threshold = 125) {
            clearChannels();

            const originalCanvas = document.getElementById(canvasId);
            const ctx = originalCanvas.getContext("2d");

            const imgData = ctx.getImageData(0, 0, originalCanvas.width, originalCanvas.height);

            const outCanvas = document.createElement("canvas");
            outCanvas.width = originalCanvas.width;
            outCanvas.height = originalCanvas.height;
            const outCtx = outCanvas.getContext("2d");

            const newImgData = outCtx.createImageData(originalCanvas.width, originalCanvas.height);

            for (let i = 0; i < imgData.data.length; i += 4) {
                const gray = Math.round(
                    0.299 * imgData.data[i] +
                    0.587 * imgData.data[i + 1] +
                    0.114 * imgData.data[i + 2]
                );

                const value = gray >= threshold ? 255 : 0;

                newImgData.data[i] = value;
                newImgData.data[i + 1] = value;
                newImgData.data[i + 2] = value;
                newImgData.data[i + 3] = imgData.data[i + 3];
            }

            outCtx.putImageData(newImgData, 0, 0);
            appendToChannels(outCanvas, `Binary (Threshold ${threshold})`);
        }

        function transformNegative(canvasId) {
            clearChannels();

            const originalCanvas = document.getElementById(canvasId);
            const ctx = originalCanvas.getContext("2d");

            const imgData = ctx.getImageData(0, 0, originalCanvas.width, originalCanvas.height);

            const outCanvas = document.createElement("canvas");
            outCanvas.width = originalCanvas.width;
            outCanvas.height = originalCanvas.height;
            const outCtx = outCanvas.getContext("2d");

            const newImgData = outCtx.createImageData(originalCanvas.width, originalCanvas.height);

            for (let i = 0; i < imgData.data.length; i += 4) {
                newImgData.data[i] = 255 - imgData.data[i];
                newImgData.data[i + 1] = 255 - imgData.data[i + 1];
                newImgData.data[i + 2] = 255 - imgData.data[i + 2];
                newImgData.data[i + 3] = imgData.data[i + 3];
            }

            outCtx.putImageData(newImgData, 0, 0);
            appendToChannels(outCanvas, "Negative Image");
        }

        document.getElementById("file1").addEventListener("change", function () {
            loadImage(this, "gambar");
            clearChannels();
        });
    </script>

</body>

</html>
